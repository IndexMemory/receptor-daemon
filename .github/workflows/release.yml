name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    # No cgo anywhere in this module (unlike receptor-desktop's Fyne UI),
    # so true cross-compilation works fine from a single Linux runner —
    # no need for native per-OS builders here.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: receptor-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: receptor-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: receptor-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: receptor-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # Embeds the exact tag this binary was built from, so `receptor
        # --version` always tells you precisely what you're running — added
        # after repeated confusion testing against a stale binary.
        run: go build -ldflags "-X main.version=${{ github.ref_name }}" -o ${{ matrix.artifact }} ./cmd/receptor

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Memory's /api/receptor-daemon/download proxy (see lib/receptor_daemon_releases.ts
      # in the memory repo — that route path itself is unchanged by the
      # receptor-daemon -> receptor CLI rename, only the asset filename
      # pattern it matches against changed) verifies a downloaded binary
      # against this before ever serving it to a daemon running `receptor
      # update` — the whole point of routing updates through Memory instead
      # of daemons fetching straight from GitHub themselves.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum receptor-* > checksums.txt

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/receptor-linux-amd64 \
            dist/receptor-linux-arm64 \
            dist/receptor-darwin-amd64 \
            dist/receptor-darwin-arm64 \
            dist/checksums.txt \
            --title "${{ github.ref_name }}" \
            --notes "Receptor Daemon ${{ github.ref_name }} — see README.md for install/run instructions. Starting with this release, the command is \`receptor\` instead of \`receptor-daemon\` — see the README's Installing section if you're updating an existing install."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
